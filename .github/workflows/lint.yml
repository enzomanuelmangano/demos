name: Lint and Format

# The React Native app in legacy/ only; the Exact app at the root has exact-lint.yml.
on:
  push:
    branches: [main]
    paths:
      - 'legacy/**'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'legacy/**'
      - '.github/workflows/lint.yml'

jobs:
  lint_and_format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint

      - name: Run TypeScript type check
        run: bun run typecheck

      - name: Run Prettier
        run: bun prettier --check 'src/**/*.ts' 'src/**/*.tsx'
