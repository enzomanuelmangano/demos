# The Demos app's GPU module, as Exact loads it (`<app>-gpu`, from the app's gpu/): every demo
# the RN app draws with Skia, three.js or WebGPU, drawn with wgpu on exact-gpu's `Surface`.
[package]
name = "demos-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Demos app's GPU surfaces: the RN demos' Skia and WebGPU drawing on wgpu"
publish = false
build = "build.rs"

[lib]
name = "demos_gpu"
crate-type = ["cdylib", "rlib"]

[dependencies]
motion = { path = "../packages/motion" }
gestures = { path = "../packages/gestures" }
draw2d = { path = "../packages/draw2d" }
pressto = { path = "../packages/pressto" }
noise = { path = "../packages/noise" }
# Inflates the bitmaps in images/ (zlib), once, when a surface first draws.
miniz_oxide = "0.9"
# Decodes the photo skia-bottom-sheet draws (images/), once, when it first draws.
zune-jpeg = "0.5"
exact-gpu = { workspace = true }


# wgpu's `std` keeps error scopes per thread. The warm-up (src/warm.rs) pushes one on its own thread
# while the main thread pushes its per-frame scope; without `std` the scopes are the device's, the two
# interleave and wgpu panics ("Mismatched pop_error_scope"). Exact builds wgpu with it only from
# b768e92c0 on, so it is asked for here, for any checkout. The browser does not warm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std"] }

[build-dependencies]
exact-gpu-reflect = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[lints]
workspace = true
