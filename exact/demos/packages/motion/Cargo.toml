# react-native-reanimated's animations, for the Demos app's GPU surfaces: what a worklet does
# on the UI thread (withSpring, withTiming, withDecay, interpolate), stepped on the host's frame
# clock inside a surface. Pure Rust, no GPU.
[package]
name = "motion"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spring, timing, easing and decay functions with the same constants as react-native-reanimated, for GPU surfaces"
publish = false

[lib]
name = "motion"
