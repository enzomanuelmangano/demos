# Demos's native workspace: the hosts exact2 generates (web/, apple/), plus the app's own GPU
# module (gpu/), where every demo the RN app draws with Skia or WebGPU is drawn with wgpu.
[workspace]
members = ["web", "apple", "gpu", "packages/reanimated", "packages/gesture-handler"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[patch.crates-io]
accesskit_windows = { path = "../../../../../../.exact/exact2/94b8671f70fe2e25b307a40e7fce66dc27c9f802/vendor/accesskit-windows" }
taffy = { path = "../../../../../../.exact/exact2/94b8671f70fe2e25b307a40e7fce66dc27c9f802/vendor/taffy" }
parley = { path = "../../../../../../.exact/exact2/94b8671f70fe2e25b307a40e7fce66dc27c9f802/vendor/parley" }
fontique = { path = "../../../../../../.exact/exact2/94b8671f70fe2e25b307a40e7fce66dc27c9f802/vendor/fontique" }
wgpu-hal = { path = "../../../../../../.exact/exact2/94b8671f70fe2e25b307a40e7fce66dc27c9f802/vendor/wgpu-hal" }
